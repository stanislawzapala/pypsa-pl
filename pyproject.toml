[project]
name = "pypsa-pl"
version = "3.1.0"
description = "PyPSA-PL: optimisation model of the Polish energy system"
authors = [
    { name = "Patryk Kubiczek", email = "patryk.kubiczek@instrat.pl" },
    { name = "Kajetan Nowak", email = "kajetan.nowak@instrat.pl" },
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pypsa==0.32.1",
    "linopy==0.5.0",
    "highspy==1.9.0",
    "numpy>=1.26.4,<2",
    "pandas>=2.2.0,<3",
    "gspread==5.12.4",
    "pyarrow>=15.0.0,<16",
    "python-dateutil==2.9.0",
    "xarray==2024.2.0",
    "matplotlib>=3.8.3,<4",
    "notebook>=7.1.2,<8",
    "ipywidgets>=8.1.2,<9",
    "gurobipy==12",
    "cartopy>=0.24.1,<0.25",
    "geopandas>=1.0.1,<2",
]

[dependency-groups]
dev = [
    "icecream>=2.1.3,<3",
    "requests>=2.31.0,<3",
]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/pypsa_pl"]

[tool.hatch.build.targets.wheel]
include = ["src/pypsa_pl"]

[tool.hatch.build.targets.wheel.sources]
"src/pypsa_pl" = "pypsa_pl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

